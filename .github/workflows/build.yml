name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Offline stub check
        run: bash devtools/stubcheck/check.sh

      - name: Resolve Fabric API version
        id: fabric
        run: |
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          pinned=$(grep '^fabric_api_version=' gradle.properties | cut -d= -f2)
          meta=$(curl -sSfL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml)
          if echo "$meta" | grep -q "<version>${pinned}</version>"; then
            version="$pinned"
          else
            version=$(echo "$meta" | grep -o "<version>[^<]*</version>" | sed 's/<[^>]*>//g' | grep -E "\+${mc}$" | tail -1)
            echo "::warning::fabric_api_version=${pinned} does not exist; using ${version}. Pin it in gradle.properties."
          fi
          echo "Fabric API for ${mc}: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Gradle build
        run: gradle build --stacktrace -Pfabric_api_version=${{ steps.fabric.outputs.version }}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: skyblock-macro
          path: build/libs/*.jar

      # The in-game updater looks for skyblock-macro-<minecraft version>.jar on each release.
      - name: Name the jar for its Minecraft version
        run: |
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp "$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -n1)" "dist/skyblock-macro-${mc}.jar"

      - name: Release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" notes.md; else echo "Skyblock Macro ${GITHUB_REF_NAME}." > notes.md; fi

      - name: Publish a versioned release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Skyblock Macro ${{ github.ref_name }}
          # Tags with a suffix (v2.2.0-beta.1) are prereleases and only reach the Beta channel.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: dist/*.jar
          body_path: notes.md

      # Every push to main becomes release <mod_version>-rN (Stable), every push to beta <mod_version>-beta-rN
      # (Beta). Re-runs on the same commit reuse its release.
      - name: Publish a numbered release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "$GITHUB_REF_NAME" = beta ]; then prefix="${version}-beta-r"; flags="--prerelease --latest=false"; else prefix="${version}-r"; flags="--latest"; fi
          pattern="^${prefix//./\\.}([0-9]+)$"
          tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.target_commitish == \"$GITHUB_SHA\") | .tag_name" | grep -E "$pattern" | head -n1 || true)
          if [ -z "$tag" ]; then
            last=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | sed -nE "s/${pattern}/\\1/p" | sort -n | tail -n1)
            tag="${prefix}$(( ${last:-0} + 1 ))"
            gh release create "$tag" --target "$GITHUB_SHA" --title "Skyblock Macro $tag" --generate-notes $flags
          fi
          gh release upload "$tag" dist/*.jar --clobber
          echo "Published $tag"

      - name: Publish a branch preview
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-preview
          name: Skyblock Macro (${{ github.ref_name }} build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: dist/*.jar
          body: |
            Automatic build of `${{ github.ref_name }}` at ${{ github.sha }}. Not picked by the in-game updater.
